name: Feature request
description: Suggest a new feature or improvement. Please check existing issues to avoid duplicates.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: Clearly describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would this be useful?
      description: Explain the problem this would solve or how it would improve GameDock.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: If you have an idea for how this could work, describe it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you tried another workflow or solution?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or anything else that may help.
    validations:
      required: false
